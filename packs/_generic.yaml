key: generic
name: Generic
industry: Industry-agnostic starting point
version: 1.0.0
description: >-
  The neutral pack. Use it when no industry pack fits, or as the base for a new one.
  Illustrative and editable — not authoritative.
editable: true

domains:
  - { key: customer, name: Customer, description: Who buys from or is served by the organisation. }
  - { key: product-service, name: Product & Service, description: What the organisation sells or provides. }
  - { key: order-transaction, name: Order & Transaction, description: Commercial events between the parties. }
  - { key: finance, name: Finance, description: Revenue, cost, margin and financial control. }
  - { key: operations, name: Operations, description: How work gets done and how well. }
  - { key: people, name: People, description: Workforce, roles and capability. }
  - { key: risk-compliance, name: Risk & Compliance, description: Obligations, controls and exposure. }

conformedBackbone:
  description: The minimum spine any organisation can conform to.
  entities:
    - { key: party, name: Party }
    - { key: account, name: Account }
    - { key: product, name: Product }
    - { key: transaction, name: Transaction }
  links:
    - { from: Party, to: Account, cardinality: ONE_TO_MANY }
    - { from: Account, to: Transaction, cardinality: ONE_TO_MANY }
    - { from: Product, to: Transaction, cardinality: ONE_TO_MANY }

canonicalEntities:
  - { key: party, name: Party, description: A person or organisation the business deals with. }
  - { key: account, name: Account, description: A relationship held by a party. }
  - { key: product, name: Product, description: A sellable or servable offering. }
  - { key: transaction, name: Transaction, description: A commercial event. }
  - { key: location, name: Location, description: A physical or logical place. }
  - { key: channel, name: Channel, description: The route through which an interaction occurred. }
  - { key: employee, name: Employee, description: A member of the workforce. }
  - { key: supplier, name: Supplier, description: A party the organisation buys from. }
  - { key: contract, name: Contract, description: An agreement governing a relationship. }
  - { key: interaction, name: Interaction, description: A recorded contact with a party. }
  - { key: case, name: Case, description: A unit of service or investigation work. }

controls:
  - { key: lawful-basis, name: Lawful basis for processing, category: Privacy, jurisdiction: General, requirement: Personal data is processed only for a recorded, lawful purpose. }
  - { key: consent, name: Consent record, category: Privacy, jurisdiction: General, requirement: Marketing use requires current recorded consent. }
  - { key: retention, name: Retention schedule, category: Records, jurisdiction: General, requirement: Records are destroyed at the end of the retention period. }
  - { key: residency, name: Data residency, category: Security, jurisdiction: General, requirement: Data remains in the primary operating region unless a transfer basis exists. }
  - { key: access-least-privilege, name: Least privilege, category: Security, jurisdiction: General, requirement: Access is granted for the narrowest purpose that satisfies the need. }
  - { key: minimisation, name: Data minimisation, category: Privacy, jurisdiction: General, requirement: Analytical products exclude identifiers unless a stated purpose requires them. }
  - { key: audit-trail, name: Audit trail, category: Governance, jurisdiction: General, requirement: Decisions affecting individuals are auditable to a named human. }
  - { key: model-explainability, name: Automated decision explainability, category: Governance, jurisdiction: General, requirement: Automated scoring must be explainable and overridable by a named human. }

starterMetrics:
  - { name: active_parties, label: Active parties, definition: Parties with activity in the period., grain: party }
  - { name: transaction_volume, label: Transaction volume, definition: Count of transactions in the period., grain: day }
  - { name: transaction_value, label: Transaction value, definition: Sum of transaction amounts., grain: day }
  - { name: gross_margin, label: Gross margin, definition: Revenue less direct cost., grain: product-month }
  - { name: churn_rate, label: Churn rate, definition: Share of parties lost in the period., grain: month }
  - { name: acquisition_cost, label: Acquisition cost, definition: Cost to acquire one new party., grain: month }
  - { name: case_cycle_time, label: Case cycle time, definition: Elapsed time from case open to close., grain: case }
  - { name: first_contact_resolution, label: First contact resolution, definition: Cases resolved on first contact., grain: case }
  - { name: supplier_on_time_rate, label: Supplier on-time rate, definition: Deliveries received on or before the promised date., grain: supplier-month }
  - { name: open_risk_items, label: Open risk items, definition: Risk items not yet closed., grain: month }

sampleDecisions:
  - consumerPersona: Operations Manager
    decision: Which cases to escalate before they breach their service commitment
    cadence: Daily
    currentWorkaround: A morning spreadsheet exported from the case system
    latencyTolerance: Hourly
    consequence: Commitments are breached and the breach is discovered after the fact.
    questions:
      - Which open cases are within 24 hours of breaching?
      - Which team owns each of them?
      - How many breached last week and why?
  - consumerPersona: Commercial Lead
    decision: Which products to reprice next quarter
    cadence: Quarterly
    currentWorkaround: Finance extracts reconciled manually against sales reports
    latencyTolerance: Weekly
    consequence: Repricing decisions are made on stale margin figures.
    questions:
      - Which products have margin below target?
      - How has margin moved over the last four quarters?
      - Which customers would be most affected by a price change?
  - consumerPersona: Risk Officer
    decision: Which open risk items require escalation to the board this month
    cadence: Monthly
    currentWorkaround: A manually maintained risk register
    latencyTolerance: Weekly
    consequence: Material risks reach the board late or not at all.
    questions:
      - Which risk items are open beyond their target close date?
      - Which have increased in severity since last month?
      - Which controls have failed testing?

platformProfiles:
  - { key: lakehouse, name: Lakehouse on object storage, bronze: Raw landing zone, silver: Conformed tables, gold: Serving tables, ingestion: Batch file load, orchestration: Scheduled DAG }
  - { key: warehouse, name: Cloud warehouse, bronze: RAW schema, silver: STAGING schema, gold: PRESENTATION schema, ingestion: Managed connector load, orchestration: Warehouse task graph }

glossary:
  - { term: Grain, definition: What exactly one row of a dataset represents. }
  - { term: Conformed backbone, definition: The shared entities every product in a workspace binds to. }
  - { term: Semantic layer, definition: The single place a metric is defined so every channel returns the same answer. }
  - { term: Data contract, definition: The promise a product makes about schema, freshness and quality. }

seedProducts:
  - key: case-sla-watch
    name: Case SLA Watch
    domainKey: operations
    archetype: EVENT_STREAM
    tier: CONSUMER_ALIGNED
    blueprint: true
    description: Open cases ranked by how close they are to breaching their service commitment.
    persona: Operations Manager
    decision: Which cases to escalate before they breach their service commitment
    cadence: Daily
    workaround: A morning spreadsheet exported from the case system
    consequence: Commitments are breached and the breach is only discovered afterwards.
    questions:
      - Which open cases are within 24 hours of breaching?
      - Which team owns each of them?
      - How many breached last week, and why?
    sources: [{ name: Case management extract, system: Service platform }]
    entities:
      - { name: Case, key: case_id, attributes: [case_id, party_id, opened_at, due_at, status, owning_team] }
      - { name: Party, key: party_id, attributes: [party_id, party_name*, segment] }
    metrics:
      - { name: cases_at_risk, label: Cases at risk, definition: Open cases within 24 hours of breach., grain: case }
      - { name: case_cycle_time, label: Case cycle time, definition: Elapsed time from open to close., grain: case }
    controls: [lawful-basis, retention, audit-trail]
    patterns: [certified-dashboard, operational-activation]
    freshness: Hourly
    qualityScore: 90
    costToServeUsdPerMonth: 180
    platformProfileKey: warehouse
    value: { statement: Cut service commitment breaches by a third, baseline: 42, unit: breaches per month, expectedChange: -14, method: Compare breach counts six months either side of launch, date: '2027-02-28', realised: false }
    telemetry: { consumers: 21, queries30d: 410, sessions30d: 160, daysSinceLastUse: 1, freshnessBreaches30d: 0 }

  - key: product-margin
    name: Product Margin
    domainKey: finance
    archetype: METRIC_KPI
    tier: AGGREGATE
    blueprint: true
    description: Certified margin by product and period, defined once for every channel.
    persona: Commercial Lead
    decision: Which products to reprice next quarter
    cadence: Quarterly
    workaround: Finance extracts reconciled by hand against sales reports
    consequence: Repricing decisions are made on stale and inconsistent margin figures.
    questions:
      - Which products have margin below target?
      - How has margin moved over the last four quarters?
      - Which customers would be most affected by a price change?
    sources: [{ name: General ledger extract, system: Finance system }, { name: Sales extract, system: Order platform }]
    entities:
      - { name: Product, key: product_id, attributes: [product_id, product_name, category, list_price_amount] }
      - { name: Transaction, key: transaction_id, attributes: [transaction_id, product_id, party_id, net_amount, cost_amount, transacted_at] }
    metrics:
      - { name: gross_margin, label: Gross margin, definition: Revenue less direct cost., grain: product-month }
      - { name: transaction_value, label: Transaction value, definition: Sum of net transaction amounts., grain: product-month }
    controls: [audit-trail, retention, access-least-privilege]
    patterns: [certified-dashboard, self-serve-exploration, conversational]
    freshness: Daily by 08:00
    qualityScore: 93
    costToServeUsdPerMonth: 240
    platformProfileKey: lakehouse
    value: { statement: Reduce quarterly margin reporting preparation from 3 days to half a day, baseline: 3, unit: days per quarter, expectedChange: -2.5, method: Time recorded by the finance analyst team, date: '2026-12-31', realised: true, measured: 0.5 }
    telemetry: { consumers: 46, queries30d: 900, sessions30d: 340, daysSinceLastUse: 1, freshnessBreaches30d: 0 }

  - key: risk-register-view
    name: Risk Register View
    domainKey: risk-compliance
    archetype: REFERENCE_DATA
    tier: CONSUMER_ALIGNED
    description: Open risk items with movement, control test results and escalation status.
    persona: Risk Officer
    decision: Which open risk items require escalation to the board this month
    cadence: Monthly
    workaround: A manually maintained risk register spreadsheet
    consequence: Material risks reach the board late or not at all.
    questions:
      - Which risk items are open beyond their target close date?
      - Which have increased in severity since last month?
      - Which controls have failed testing?
    sources: [{ name: GRC export, system: Risk platform }]
    entities:
      - { name: Risk Item, key: risk_id, attributes: [risk_id, title, severity, target_close_date, owner_name*, status] }
      - { name: Control Test, key: test_id, attributes: [test_id, risk_id, tested_at, outcome] }
    metrics:
      - { name: open_risk_items, label: Open risk items, definition: Risk items not yet closed., grain: month }
      - { name: failed_control_tests, label: Failed control tests, definition: Control tests with a failing outcome., grain: month }
    controls: [audit-trail, minimisation, access-least-privilege]
    patterns: [certified-dashboard, bulk-extract]
    freshness: Weekly
    qualityScore: 85
    costToServeUsdPerMonth: 90
    platformProfileKey: warehouse
    value: { statement: Halve the time to prepare the monthly board risk pack, baseline: 8, unit: hours per month, expectedChange: -4, method: Time study with the risk team, date: '2027-01-31', realised: false }
    telemetry: { consumers: 6, queries30d: 30, sessions30d: 14, daysSinceLastUse: 12, freshnessBreaches30d: 0 }

  - key: customer-single-view
    name: Customer Single View
    domainKey: customer
    archetype: ENTITY_MASTER
    tier: CONSUMER_ALIGNED
    description: One record per customer, resolved across source systems, with consent and contactability.
    persona: Customer Operations Lead
    decision: Which customers to contact about a service change, and through which channel
    cadence: Weekly
    workaround: Customer lists exported per system and matched on email in a spreadsheet
    consequence: The same customer is contacted three times, or not at all.
    questions:
      - Which customers exist in more than one source system?
      - Which have no reachable contact channel?
      - Which have withdrawn consent for one purpose but not another?
    sources:
      - { name: Customer master, system: CRM }
      - { name: Consent register, system: Preference centre }
    entities:
      - name: Customer
        key: customer_id
        attributes: [customer_id, customer_name*, contact_email*, source_system, consent_state]
      - name: ContactChannel
        key: channel_id
        attributes: [channel_id, customer_id, channel_type, verified_at, deliverable]
    metrics:
      - { name: duplicate_customer_records, label: Duplicate customer records, definition: Customers present in more than one source system without resolution., grain: customer }
      - { name: contactable_customer_rate, label: Contactable customer rate, definition: Share of customers with at least one deliverable channel., grain: customer }
      - { name: consent_coverage_by_purpose, label: Consent coverage by purpose, definition: Share of customers with valid consent for each processing purpose., grain: purpose }
    controls: [lawful-basis, consent, minimisation, retention]
    patterns: [certified-dashboard, operational-activation]
    freshness: Daily by 07:00
    qualityScore: 89
    costToServeUsdPerMonth: 340
    platformProfileKey: warehouse
    value:
      statement: Cut duplicate customer records from 12% to under 3%
      baseline: 12
      unit: percent duplicated
      expectedChange: -9
      method: Match-rate reporting against the resolved master, monthly
      date: '2027-04-30'
      realised: false
    telemetry: { consumers: 24, queries30d: 420, sessions30d: 150, daysSinceLastUse: 2, freshnessBreaches30d: 0 }

  - key: product-and-service-catalogue
    name: Product & Service Catalogue
    domainKey: product-service
    archetype: REFERENCE_DATA
    tier: SOURCE_ALIGNED
    description: The authoritative list of what the organisation sells or provides, with lifecycle state and owner.
    persona: Product Data Steward
    decision: Which catalogue entries to retire, merge or reassign an owner to
    cadence: Monthly
    workaround: Several catalogue extracts, none of them agreed to be the definitive one
    consequence: Reporting disagrees between teams because each counts a different product list.
    questions:
      - Which catalogue entries have no named owner?
      - Which products are marked active but have had no activity in a year?
      - Which entries appear under more than one identifier?
    sources:
      - { name: Product master, system: ERP }
      - { name: Service catalogue, system: Service management }
    entities:
      - name: CatalogueItem
        key: catalogue_item_id
        attributes: [catalogue_item_id, item_name, item_type, lifecycle_state, owner_role]
      - name: ItemIdentifier
        key: identifier_id
        attributes: [identifier_id, catalogue_item_id, identifier_system, identifier_value]
    metrics:
      - { name: unowned_catalogue_items, label: Unowned catalogue items, definition: Catalogue entries with no named accountable owner., grain: item }
      - { name: dormant_active_items, label: Dormant active items, definition: Items marked active with no activity in twelve months., grain: item }
      - { name: duplicate_identifier_count, label: Duplicate identifiers, definition: Catalogue entries reachable by more than one identifier., grain: item }
    controls: [audit-trail, retention, access-least-privilege, residency]
    patterns: [certified-dashboard, api-embedded, bulk-extract]
    freshness: Weekly, Monday 06:00
    qualityScore: 91
    costToServeUsdPerMonth: 220
    platformProfileKey: warehouse
    value:
      statement: Give every active catalogue entry a named owner
      baseline: 63
      unit: percent with a named owner
      expectedChange: 37
      method: Catalogue stewardship review, monthly
      date: '2027-03-31'
      realised: true
      measured: 99
    telemetry: { consumers: 19, queries30d: 230, sessions30d: 90, daysSinceLastUse: 4, freshnessBreaches30d: 0 }

  - key: order-to-cash
    name: Order to Cash
    domainKey: order-transaction
    archetype: EVENT_STREAM
    tier: CONSUMER_ALIGNED
    description: Orders from capture through fulfilment to payment, with the delay at each handover visible.
    persona: Order Operations Manager
    decision: Which handover in the order process to fix next
    cadence: Weekly
    workaround: Order status counts pulled from each system separately with no end-to-end view
    consequence: Cash is delayed by a handover nobody owns because nobody can see it.
    questions:
      - Which stage of the order process holds orders longest?
      - How many orders are fulfilled but not yet invoiced?
      - Which order types most often need manual intervention?
    sources:
      - { name: Order events, system: Order management }
      - { name: Invoice and payment records, system: Finance }
    entities:
      - name: Order
        key: order_id
        attributes: [order_id, customer_id, order_type, placed_at, fulfilled_at, invoiced_at]
      - name: OrderStageEvent
        key: order_stage_event_id
        attributes: [order_stage_event_id, order_id, stage, entered_at, exited_at, manual_touch]
    metrics:
      - { name: stage_dwell_time_hours, label: Stage dwell time, definition: Hours an order spends in each process stage., grain: stage }
      - { name: fulfilled_not_invoiced, label: Fulfilled not invoiced, definition: Orders delivered but with no invoice raised., grain: order }
      - { name: manual_intervention_rate, label: Manual intervention rate, definition: Share of orders requiring a manual touch to progress., grain: order }
    controls: [audit-trail, retention, minimisation, access-least-privilege]
    patterns: [certified-dashboard, operational-activation, self-serve-exploration]
    freshness: Daily by 05:00
    qualityScore: 88
    costToServeUsdPerMonth: 380
    platformProfileKey: lakehouse
    value:
      statement: Reduce days sales outstanding by removing the worst handover delay
      baseline: 47
      unit: days sales outstanding
      expectedChange: -9
      method: Finance DSO reporting, monthly
      date: '2027-05-31'
      realised: false
    telemetry: { consumers: 26, queries30d: 460, sessions30d: 165, daysSinceLastUse: 1, freshnessBreaches30d: 1 }

  - key: workforce-composition
    name: Workforce Composition
    domainKey: people
    archetype: METRIC_KPI
    tier: AGGREGATE
    description: Headcount, joiners, leavers and internal moves by team, reported at a grain that cannot identify an individual.
    persona: People Director
    decision: Which teams to prioritise for recruitment or retention effort
    cadence: Monthly
    workaround: HR extracts summarised by hand, with small teams accidentally identifiable
    consequence: Either the numbers are late, or they expose individuals who should not be identifiable.
    questions:
      - Which teams have the highest voluntary leaver rate?
      - How long do vacancies stay open by team?
      - What share of moves are internal rather than external hires?
    sources:
      - { name: Employee records, system: HR system }
      - { name: Recruitment pipeline, system: ATS }
    entities:
      - name: TeamPeriod
        key: team_period_id
        attributes: [team_period_id, team_id, period, headcount_fte, joiners, leavers]
      - name: Vacancy
        key: vacancy_id
        attributes: [vacancy_id, team_id, opened_at, closed_at, fill_source]
    metrics:
      - { name: voluntary_leaver_rate, label: Voluntary leaver rate, definition: Voluntary leavers as a share of average headcount., grain: team }
      - { name: vacancy_open_days, label: Vacancy open days, definition: Days a vacancy remains open before being filled., grain: vacancy }
      - { name: internal_fill_share, label: Internal fill share, definition: Share of vacancies filled by an internal move., grain: team }
    controls: [minimisation, lawful-basis, retention, access-least-privilege]
    patterns: [certified-dashboard, self-serve-exploration]
    freshness: Monthly, by working day 5
    qualityScore: 90
    costToServeUsdPerMonth: 250
    platformProfileKey: warehouse
    value:
      statement: Report workforce metrics without ever exposing an individual
      baseline: 0
      unit: teams reportable at a safe minimum group size
      expectedChange: 100
      method: Disclosure control review of every published breakdown
      date: '2027-06-30'
      realised: false
    telemetry: { consumers: 14, queries30d: 180, sessions30d: 70, daysSinceLastUse: 8, freshnessBreaches30d: 0 }
