key: utility-energy
name: Utility & Energy
industry: Utilities and energy retail/distribution
version: 1.0.0
description: >-
  Reference implementation pack. Domains, conformed backbone and controls for a regulated
  utility running metering, billing, credit, outage and network asset operations.
  Illustrative and editable — not authoritative, and not legal advice.
editable: true

domains:
  - key: customer-account
    name: Customer & Account
    description: Who the customer is, what they hold, and how they are contactable.
  - key: metering-ami
    name: Metering & AMI
    description: Meters, service points, interval reads and AMI event streams.
  - key: billing-revenue
    name: Billing & Revenue
    description: Rating, invoicing, payments and revenue assurance.
  - key: credit-collections
    name: Credit & Collections
    description: Arrears, payment plans, disconnection and protected-status handling.
  - key: outage-reliability
    name: Outage & Reliability
    description: Interruptions, restoration, SAIDI/SAIFI and customer impact.
  - key: network-grid-assets
    name: Network & Grid Assets
    description: Substations, feeders, transformers and asset health.
  - key: der-programs
    name: DER & Programs
    description: Distributed energy resources, tariffs, demand response and enrolment.
  - key: field-work-management
    name: Field & Work Management
    description: Work orders, crews, appointments and field completion.

conformedBackbone:
  description: The spine every utility data product binds to.
  entities:
    - { key: customer, name: Customer }
    - { key: account, name: Account }
    - { key: premise, name: Premise }
    - { key: service-point, name: Service Point }
    - { key: meter, name: Meter }
  links:
    - { from: Customer, to: Account, cardinality: ONE_TO_MANY }
    - { from: Account, to: Premise, cardinality: ONE_TO_MANY }
    - { from: Premise, to: Service Point, cardinality: ONE_TO_MANY }
    - { from: Service Point, to: Meter, cardinality: ONE_TO_MANY }

canonicalEntities:
  - { key: customer, name: Customer, description: A person or organisation in a supply relationship. }
  - { key: account, name: Account, description: The billing relationship held by a customer. }
  - { key: premise, name: Premise, description: A physical location that can take supply. }
  - { key: service-point, name: Service Point, description: The delivery point at a premise. }
  - { key: meter, name: Meter, description: The device measuring consumption at a service point. }
  - { key: interval-read, name: Interval Read, description: A timestamped consumption measurement. }
  - { key: invoice, name: Invoice, description: A rated bill issued against an account. }
  - { key: payment, name: Payment, description: Money received against an account. }
  - { key: outage-event, name: Outage Event, description: An unplanned interruption of supply. }
  - { key: work-order, name: Work Order, description: Field work raised against an asset or premise. }
  - { key: transformer, name: Transformer, description: A network asset serving one or more service points. }
  - { key: program-enrolment, name: Program Enrolment, description: A customer's participation in a tariff or DER program. }

controls:
  - key: consent-marketing
    name: Marketing consent
    category: Privacy
    jurisdiction: General
    requirement: Customer contact data may be used for marketing only with recorded, current consent.
  - key: protected-status
    name: Protected and vulnerable customers
    category: Regulatory
    jurisdiction: General
    requirement: Customers flagged as medically dependent or protected must never appear on a disconnection list.
  - key: retention-billing
    name: Billing record retention
    category: Records
    jurisdiction: General
    requirement: Billing and payment records are retained for seven years and then destroyed.
  - key: reg-reporting-reliability
    name: Reliability reporting
    category: Regulatory
    jurisdiction: General
    requirement: Reliability indices are reported to the regulator on a fixed calendar with auditable lineage.
  - key: pii-minimisation
    name: Personal data minimisation
    category: Privacy
    jurisdiction: General
    requirement: Personal identifiers are excluded from analytical products unless a stated purpose requires them.
  - key: meter-data-access
    name: Metering data access
    category: Regulatory
    jurisdiction: General
    requirement: Interval metering data may be disclosed only to the customer of record or an authorised agent.
  - key: residency
    name: Data residency
    category: Security
    jurisdiction: General
    requirement: Customer and metering data remain within the primary operating region.
  - key: credit-fairness
    name: Credit decision fairness
    category: Regulatory
    jurisdiction: General
    requirement: Automated credit and collections scoring must be explainable and overridable by a named human.

starterMetrics:
  - { name: active_customers, label: Active customers, definition: Customers with at least one active account., grain: customer }
  - { name: billed_revenue, label: Billed revenue, definition: Sum of invoiced amounts in the period., grain: account-month }
  - { name: unbilled_accounts, label: Unbilled accounts, definition: Accounts with no invoice in the expected cycle., grain: account }
  - { name: arrears_balance, label: Arrears balance, definition: Overdue balance across accounts., grain: account }
  - { name: saidi, label: SAIDI, definition: System average interruption duration index., grain: feeder-month }
  - { name: saifi, label: SAIFI, definition: System average interruption frequency index., grain: feeder-month }
  - { name: estimated_read_rate, label: Estimated read rate, definition: Share of billing determinants derived from estimates., grain: account-month }
  - { name: meter_communication_rate, label: Meter communication rate, definition: Share of meters reporting on schedule., grain: meter-day }
  - { name: der_enrolment_rate, label: DER enrolment rate, definition: Share of eligible customers enrolled in a DER program., grain: program-month }
  - { name: first_visit_resolution, label: First visit resolution, definition: Work orders completed on the first field visit., grain: work-order }
  - { name: consumption_kwh, label: Consumption, definition: Metered energy consumed in the period., grain: service-point-day }

sampleDecisions:
  - consumerPersona: Credit & Collections Manager
    decision: Which accounts to place on a payment plan this week rather than escalate
    cadence: Weekly
    currentWorkaround: A spreadsheet joining billing extracts to a manual protected-status list
    latencyTolerance: Daily by 07:00
    consequence: Protected customers are escalated in error, and recoverable arrears age past the point of recovery.
    questions:
      - Which accounts crossed 60 days in arrears this week?
      - Which of those accounts hold a protected or medically dependent flag?
      - What is the expected recovery if we offer a plan rather than escalate?
  - consumerPersona: Reliability Engineer
    decision: Which feeders to prioritise for vegetation management next quarter
    cadence: Quarterly
    currentWorkaround: Outage exports reconciled by hand against an asset register
    latencyTolerance: Weekly
    consequence: Spend goes to feeders that are not driving customer minutes lost.
    questions:
      - Which feeders contributed most customer minutes lost in the last 12 months?
      - How much of that was vegetation-related?
      - Which of those feeders serve protected customers?
  - consumerPersona: Revenue Assurance Analyst
    decision: Which billing exceptions to investigate first
    cadence: Daily
    currentWorkaround: A nightly report with no ranking
    latencyTolerance: Daily by 06:00
    consequence: Unbilled revenue ages and becomes unrecoverable.
    questions:
      - Which accounts have no invoice in their expected cycle?
      - What is the estimated value at risk per exception?
      - How many exceptions are caused by meter communication failure?

platformProfiles:
  - key: snowflake
    name: Snowflake
    bronze: RAW schema, one table per source extract
    silver: CONFORMED schema, typed and deduplicated
    gold: PRODUCT schema, one view per certified product
    ingestion: Batch COPY INTO from staged extracts
    orchestration: Task graph on a daily schedule
  - key: databricks
    name: Databricks lakehouse
    bronze: Bronze Delta tables per source
    silver: Silver Delta tables, conformed
    gold: Gold Delta tables serving the semantic layer
    ingestion: Auto Loader from cloud storage
    orchestration: Workflows with task dependencies
  - key: on-prem
    name: On-premises warehouse
    bronze: Landing schema
    silver: Staging schema
    gold: Presentation schema
    ingestion: Scheduled ETL extracts
    orchestration: Enterprise scheduler

glossary:
  - { term: Service point, definition: The physical delivery point at which supply is measured. }
  - { term: AMI, definition: Advanced Metering Infrastructure — meters that report remotely on a schedule. }
  - { term: SAIDI, definition: Average outage minutes experienced per customer served. }
  - { term: Estimated read, definition: A billing determinant derived rather than measured. }
  - { term: Protected status, definition: A customer flag restricting disconnection and collections action. }
  - { term: Feeder, definition: A distribution circuit serving a group of service points. }

seedProducts:
  - key: arrears-and-protection
    name: Arrears & Customer Protection
    domainKey: credit-collections
    archetype: ENTITY_MASTER
    tier: CONSUMER_ALIGNED
    blueprint: true
    description: A single view of account arrears with protected-status enforcement built in.
    persona: Credit & Collections Manager
    decision: Which accounts to place on a payment plan this week rather than escalate
    cadence: Weekly
    workaround: A spreadsheet joining billing extracts to a manually maintained protection list
    consequence: Protected customers are escalated in error and recoverable arrears age past recovery.
    questions:
      - Which accounts crossed 60 days in arrears this week?
      - Which of those accounts hold a protected or medically dependent flag?
      - What is the expected recovery if we offer a plan rather than escalate?
    sources:
      - { name: Billing extract, system: SAP IS-U }
      - { name: Customer master, system: CIS }
    entities:
      - name: Account
        key: account_id
        attributes: [account_id, customer_id, arrears_balance, days_in_arrears, protected_flag, opened_at]
      - name: Customer
        key: customer_id
        attributes: [customer_id, customer_name*, contact_email*, segment]
    metrics:
      - { name: arrears_balance, label: Arrears balance, definition: Overdue balance across accounts., grain: account }
      - { name: protected_accounts_in_arrears, label: Protected accounts in arrears, definition: Accounts in arrears carrying a protected flag., grain: account }
      - { name: expected_recovery_value, label: Expected recovery value, definition: Modelled recovery if a payment plan is offered., grain: account }
    controls: [protected-status, credit-fairness, pii-minimisation, retention-billing]
    patterns: [certified-dashboard, self-serve-exploration, operational-activation]
    freshness: Daily by 07:00
    qualityScore: 94
    costToServeUsdPerMonth: 480
    platformProfileKey: snowflake
    value:
      statement: Reduce weekly collections list preparation from 6 hours to under 1 hour
      baseline: 6
      unit: hours per week
      expectedChange: -5
      method: Time study with the collections team, before and after
      date: '2026-11-30'
      realised: true
      measured: 1.2
    telemetry: { consumers: 34, queries30d: 820, sessions30d: 260, daysSinceLastUse: 1, freshnessBreaches30d: 0 }

  - key: feeder-reliability
    name: Feeder Reliability
    domainKey: outage-reliability
    archetype: METRIC_KPI
    tier: AGGREGATE
    blueprint: true
    description: Customer minutes lost by feeder, with cause attribution and protected-customer exposure.
    persona: Reliability Engineer
    decision: Which feeders to prioritise for vegetation management next quarter
    cadence: Quarterly
    workaround: Outage exports reconciled by hand against the asset register
    consequence: Maintenance spend goes to feeders that are not driving customer minutes lost.
    questions:
      - Which feeders contributed most customer minutes lost in the last 12 months?
      - How much of that was vegetation-related?
      - Which of those feeders serve protected customers?
    sources:
      - { name: Outage management extract, system: OMS }
      - { name: Asset register, system: GIS }
    entities:
      - name: Outage Event
        key: outage_id
        attributes: [outage_id, feeder_id, started_at, restored_at, cause_code, customers_affected]
      - name: Feeder
        key: feeder_id
        attributes: [feeder_id, substation_id, customers_served, vegetation_risk_score]
    metrics:
      - { name: saidi, label: SAIDI, definition: System average interruption duration index., grain: feeder-month }
      - { name: saifi, label: SAIFI, definition: System average interruption frequency index., grain: feeder-month }
      - { name: vegetation_cml_share, label: Vegetation share of CML, definition: Share of customer minutes lost attributed to vegetation., grain: feeder-year }
    controls: [reg-reporting-reliability, residency, protected-status]
    patterns: [certified-dashboard, self-serve-exploration, bulk-extract]
    freshness: Daily by 06:00
    qualityScore: 91
    costToServeUsdPerMonth: 310
    platformProfileKey: snowflake
    value:
      statement: Shift 20% of vegetation spend to the feeders driving the most customer minutes lost
      baseline: 0
      unit: percent of spend reallocated
      expectedChange: 20
      method: Compare planned versus actual spend allocation against the CML ranking
      date: '2027-03-31'
      realised: false
    telemetry: { consumers: 12, queries30d: 140, sessions30d: 60, daysSinceLastUse: 3, freshnessBreaches30d: 1 }

  - key: billing-exceptions
    name: Billing Exceptions
    domainKey: billing-revenue
    archetype: EVENT_STREAM
    tier: SOURCE_ALIGNED
    description: Ranked billing exceptions with estimated value at risk and root-cause attribution.
    persona: Revenue Assurance Analyst
    decision: Which billing exceptions to investigate first each morning
    cadence: Daily
    workaround: An unranked nightly exception report
    consequence: Unbilled revenue ages past the point where it can be recovered.
    questions:
      - Which accounts have no invoice in their expected cycle?
      - What is the estimated value at risk per exception?
      - How many exceptions are caused by meter communication failure?
    sources:
      - { name: Invoice extract, system: SAP IS-U }
      - { name: AMI read events, system: Head-end system }
    entities:
      - name: Billing Exception
        key: exception_id
        attributes: [exception_id, account_id, meter_id, exception_type, value_at_risk_amount, detected_at]
      - name: Meter
        key: meter_id
        attributes: [meter_id, service_point_id, comms_status, last_read_at]
    metrics:
      - { name: unbilled_accounts, label: Unbilled accounts, definition: Accounts with no invoice in the expected cycle., grain: account }
      - { name: value_at_risk, label: Value at risk, definition: Estimated unbilled revenue across open exceptions., grain: exception }
      - { name: comms_failure_exceptions, label: Comms-failure exceptions, definition: Exceptions attributable to meter communication failure., grain: exception }
    controls: [meter-data-access, retention-billing, residency]
    patterns: [certified-dashboard, api-embedded, operational-activation]
    freshness: Daily by 06:00
    qualityScore: 88
    costToServeUsdPerMonth: 260
    platformProfileKey: databricks
    value:
      statement: Recover an additional 2% of exception value within the billing cycle
      baseline: 0
      unit: percent of exception value recovered in-cycle
      expectedChange: 2
      method: Compare in-cycle recovery rates for six months before and after
      date: '2027-01-31'
      realised: false
    telemetry: { consumers: 8, queries30d: 60, sessions30d: 25, daysSinceLastUse: 120, freshnessBreaches30d: 3 }

  # --- Customer & Account ---------------------------------------------------
  # Four products under one domain on purpose: it is the domain a utility has most
  # decisions in, and it shows that a domain is a place to look, not a single product.
  - key: customer-contactability
    name: Customer Contactability
    domainKey: customer-account
    archetype: ENTITY_MASTER
    tier: CONSUMER_ALIGNED
    description: Whether we can actually reach a customer, by which channel, and with what consent.
    persona: Customer Communications Lead
    decision: Which channel to use for an outage or debt notification for each customer this week
    cadence: Weekly
    workaround: CRM exports cross-checked by hand against bounce reports and consent spreadsheets
    consequence: Critical notifications go to dead addresses and the customer finds out from a neighbour.
    questions:
      - Which customers have no reachable contact channel at all?
      - Which contact records failed delivery in the last 90 days?
      - Which customers have withdrawn consent for marketing but not for service messages?
    sources:
      - { name: Customer master, system: CIS }
      - { name: Delivery receipts, system: Notification platform }
    entities:
      - name: Customer
        key: customer_id
        attributes: [customer_id, customer_name*, contact_email*, contact_mobile*, preferred_channel, consent_marketing]
      - name: ContactAttempt
        key: attempt_id
        attributes: [attempt_id, customer_id, channel, sent_at, delivery_status]
    metrics:
      - { name: reachable_customer_rate, label: Reachable customer rate, definition: Share of customers with at least one channel that delivered in the last 90 days., grain: customer }
      - { name: contact_delivery_failure_rate, label: Contact delivery failure rate, definition: Share of contact attempts that failed delivery., grain: attempt }
      - { name: service_consent_coverage, label: Service consent coverage, definition: Share of customers with valid consent for service notifications., grain: customer }
    controls: [consent-marketing, pii-minimisation, retention-billing, residency]
    patterns: [certified-dashboard, operational-activation]
    freshness: Daily by 06:00
    qualityScore: 91
    costToServeUsdPerMonth: 310
    platformProfileKey: snowflake
    value:
      statement: Cut undeliverable outage notifications from 14% to under 5% of sends
      baseline: 14
      unit: percent undeliverable
      expectedChange: -9
      method: Delivery-receipt analysis over two comparable storm periods
      date: '2026-12-31'
      realised: true
      measured: 4.6
    telemetry: { consumers: 22, queries30d: 410, sessions30d: 140, daysSinceLastUse: 1, freshnessBreaches30d: 0 }

  - key: vulnerable-customer-register
    name: Vulnerable Customer Register
    domainKey: customer-account
    archetype: ENTITY_MASTER
    tier: CONSUMER_ALIGNED
    description: Who carries a vulnerability or medical-dependency flag, from which source, and how recently it was confirmed.
    persona: Customer Care Team Leader
    decision: Which customers to exclude from disconnection and prioritise during an outage
    cadence: Daily
    workaround: Three separate registers reconciled by a team leader each morning
    consequence: A medically dependent customer is disconnected or missed during restoration.
    questions:
      - Which customers hold an active vulnerability flag today?
      - Which flags have not been reconfirmed within their review period?
      - Which vulnerable customers are on a feeder currently at risk?
    sources:
      - { name: Care register, system: CIS }
      - { name: Medical dependency submissions, system: Care portal }
    entities:
      - name: Customer
        key: customer_id
        attributes: [customer_id, customer_name*, vulnerability_type*, medical_dependency_flag*, confirmed_at, review_due_at]
      - name: Premise
        key: premise_id
        attributes: [premise_id, customer_id, feeder_id, address*]
    metrics:
      - { name: active_vulnerability_flags, label: Active vulnerability flags, definition: Customers holding an in-date vulnerability or medical-dependency flag., grain: customer }
      - { name: overdue_vulnerability_reviews, label: Overdue vulnerability reviews, definition: Flags past their reconfirmation date., grain: customer }
      - { name: vulnerable_customers_at_risk, label: Vulnerable customers at risk, definition: Flagged customers served by a feeder with an open reliability concern., grain: customer }
    controls: [protected-status, pii-minimisation, residency, retention-billing]
    patterns: [certified-dashboard, operational-activation, api-embedded]
    freshness: Hourly
    qualityScore: 96
    costToServeUsdPerMonth: 540
    platformProfileKey: snowflake
    value:
      statement: Eliminate erroneous disconnection of medically dependent customers
      baseline: 7
      unit: incidents per year
      expectedChange: -7
      method: Incident review against the regulator-reportable disconnection log
      date: '2027-03-31'
      realised: false
    telemetry: { consumers: 41, queries30d: 1180, sessions30d: 390, daysSinceLastUse: 1, freshnessBreaches30d: 0 }

  - key: move-in-move-out
    name: Move-In / Move-Out
    domainKey: customer-account
    archetype: EVENT_STREAM
    tier: SOURCE_ALIGNED
    description: Occupancy changes at a premise, joined to final reads and account opening, so the gap between them is visible.
    persona: Revenue Assurance Analyst
    decision: Which premises to chase for an unclosed move-out before the revenue becomes unrecoverable
    cadence: Weekly
    workaround: Occupancy events exported and matched to reads in a pivot table
    consequence: Energy is consumed at a premise with nobody billable attached to it.
    questions:
      - Which move-outs have no final read within five days?
      - Which premises have been unoccupied on the system but consuming energy?
      - How long does a move-in take to reach first bill?
    sources:
      - { name: Occupancy events, system: CIS }
      - { name: Interval reads, system: MDM }
    entities:
      - name: OccupancyEvent
        key: occupancy_event_id
        attributes: [occupancy_event_id, premise_id, account_id, event_type, effective_date]
      - name: Premise
        key: premise_id
        attributes: [premise_id, address*, service_point_id, occupancy_status]
    metrics:
      - { name: unclosed_move_outs, label: Unclosed move-outs, definition: Move-out events with no final read recorded within five days., grain: occupancy event }
      - { name: unoccupied_consumption_kwh, label: Unoccupied consumption, definition: Energy consumed at premises flagged unoccupied., grain: premise }
      - { name: move_in_to_first_bill_days, label: Move-in to first bill, definition: Days from move-in effective date to first issued invoice., grain: occupancy event }
    controls: [retention-billing, pii-minimisation, meter-data-access]
    patterns: [certified-dashboard, bulk-extract]
    freshness: Daily by 05:00
    qualityScore: 88
    costToServeUsdPerMonth: 260
    platformProfileKey: databricks
    value:
      statement: Recover revenue lost to unclosed move-outs
      baseline: 410000
      unit: USD leakage per year
      expectedChange: -280000
      method: Compare billed energy to metered energy at premise level, year on year
      date: '2027-02-28'
      realised: false
    telemetry: { consumers: 15, queries30d: 230, sessions30d: 90, daysSinceLastUse: 3, freshnessBreaches30d: 1 }

  # --- Metering & AMI -------------------------------------------------------
  - key: meter-data-quality
    name: Meter Data Quality
    domainKey: metering-ami
    archetype: METRIC_KPI
    tier: AGGREGATE
    description: Estimated versus actual reads, communication health and gap analysis across the AMI estate.
    persona: Metering Operations Manager
    decision: Which meter population to send a field crew to before the next billing run
    cadence: Weekly
    workaround: Head-end system exports summarised in a weekly spreadsheet
    consequence: Bills go out on estimates, complaints follow, and the true fault stays hidden.
    questions:
      - Which meters have not communicated in the last seven days?
      - What share of reads used in the last billing run were estimated?
      - Which communication failures cluster on a single collector?
    sources:
      - { name: Head-end read stream, system: AMI head-end }
      - { name: Meter register, system: MDM }
    entities:
      - name: Meter
        key: meter_id
        attributes: [meter_id, service_point_id, collector_id, install_date, comms_module_type]
      - name: IntervalRead
        key: read_id
        attributes: [read_id, meter_id, read_ts, kwh, read_source, quality_flag]
    metrics:
      - { name: estimated_read_share, label: Estimated read share, definition: Share of reads used for billing that were estimated rather than actual., grain: billing run }
      - { name: meter_comms_silence_days, label: Meter communication silence, definition: Days since a meter last reported to the head-end., grain: meter }
      - { name: collector_failure_concentration, label: Collector failure concentration, definition: Share of non-communicating meters attributable to a single collector., grain: collector }
    controls: [meter-data-access, pii-minimisation, retention-billing]
    patterns: [certified-dashboard, self-serve-exploration, operational-activation]
    freshness: Daily by 04:00
    qualityScore: 92
    costToServeUsdPerMonth: 620
    platformProfileKey: databricks
    value:
      statement: Reduce estimated reads in the monthly billing run below 2%
      baseline: 6.4
      unit: percent estimated
      expectedChange: -4.4
      method: Billing-run composition report, monthly
      date: '2027-01-31'
      realised: true
      measured: 2.1
    telemetry: { consumers: 28, queries30d: 640, sessions30d: 210, daysSinceLastUse: 2, freshnessBreaches30d: 1 }

  # --- Network & Grid Assets ------------------------------------------------
  - key: transformer-health
    name: Transformer Health
    domainKey: network-grid-assets
    archetype: ENTITY_MASTER
    tier: CONSUMER_ALIGNED
    description: Condition, loading and replacement priority for distribution transformers.
    persona: Asset Strategy Engineer
    decision: Which transformers to replace in next year's capital programme
    cadence: Quarterly
    workaround: Asset register joined to loading estimates in a long-lived spreadsheet
    consequence: Capital goes to assets that are old rather than assets that are failing.
    questions:
      - Which transformers are loaded beyond nameplate more than 5% of the time?
      - Which have both high loading and an ageing condition score?
      - How many customers would an unplanned failure affect for each candidate?
    sources:
      - { name: Asset register, system: GIS }
      - { name: Loading telemetry, system: SCADA }
    entities:
      - name: Transformer
        key: transformer_id
        attributes: [transformer_id, feeder_id, nameplate_kva, install_year, condition_score]
      - name: ServicePoint
        key: service_point_id
        attributes: [service_point_id, transformer_id, premise_id, connection_type]
    metrics:
      - { name: transformer_overload_hours, label: Transformer overload hours, definition: Hours per year loaded above nameplate rating., grain: transformer }
      - { name: transformer_condition_index, label: Transformer condition index, definition: Composite condition score from age, loading history and inspection results., grain: transformer }
      - { name: customers_exposed_per_asset, label: Customers exposed per asset, definition: Customers downstream of a single transformer., grain: transformer }
    controls: [reg-reporting-reliability, residency]
    patterns: [certified-dashboard, self-serve-exploration, ml-feature]
    freshness: Weekly, Monday 06:00
    qualityScore: 87
    costToServeUsdPerMonth: 450
    platformProfileKey: databricks
    value:
      statement: Shift replacement spend towards assets with genuine failure risk
      baseline: 38
      unit: percent of spend on high-risk assets
      expectedChange: 30
      method: Capital programme composition review against realised failures
      date: '2027-06-30'
      realised: false
    telemetry: { consumers: 12, queries30d: 150, sessions30d: 70, daysSinceLastUse: 9, freshnessBreaches30d: 0 }

  # --- DER & Programs -------------------------------------------------------
  - key: der-enrolment-and-performance
    name: DER Enrolment & Performance
    domainKey: der-programs
    archetype: METRIC_KPI
    tier: CONSUMER_ALIGNED
    description: Who is enrolled in which demand-side programme, and whether the programme delivered the load reduction it promised.
    persona: DER Programme Manager
    decision: Which programmes to expand, reprice or close at the next review
    cadence: Monthly
    workaround: Enrolment lists from the programme vendor reconciled to interval data by hand
    consequence: Programmes are renewed on enrolment counts rather than on delivered load reduction.
    questions:
      - How many customers are actively enrolled in each programme this month?
      - What load reduction did each programme actually deliver during called events?
      - Which enrolled customers have never responded to an event?
    sources:
